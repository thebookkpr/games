<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bunny in the Forest: Moonroot Wilds</title>
<style>
:root{
  --bg:#eef0e4; --ink:#2b3a2e; --muted:#5f6f5e; --line:#c9d3bd;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark; --bg:#122021; --ink:#eef0e0; --muted:#9db3a2; --line:#2f4a46;}
}
:root[data-theme="dark"]{color-scheme:dark; --bg:#122021; --ink:#eef0e0; --muted:#9db3a2; --line:#2f4a46;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{
  min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;
  display:flex; flex-direction:column; align-items:center; gap:14px;
  padding:24px 16px 32px; user-select:none; -webkit-user-select:none;
}
h1{font-size:1.6rem; font-weight:400; margin:0}
p{margin:0; color:var(--muted); font-size:.95rem; text-align:center; line-height:1.45; max-width:36ch}
.stage{width:100%; max-width:380px; aspect-ratio:3/4; border-radius:18px; overflow:hidden; border:1px solid var(--line); touch-action:none; cursor:pointer}
canvas{width:100%; height:100%; display:block; touch-action:none}
.bar{width:100%; max-width:380px; display:flex; justify-content:space-between; align-items:center}
.bar a,.bar button{font:inherit; font-size:.9rem; color:var(--ink); background:transparent; text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:6px 14px; cursor:pointer}
.bar a:hover,.bar button:hover{background:var(--line)}
</style>
</head>
<body>
<div class="bar">
  <a href="https://thebookkpr.github.io/games/index.html" target="_top" rel="noopener">← Home</a>
  <button id="mute" type="button" aria-label="Toggle sound">♪ On</button>
</div>
<h1>Moonroot Wilds</h1>
<p>Press and hold to hop. Hold longer to hop higher. Gather 60 autumn leaves with Bramble. Bounce on mushrooms to fly high!</p>
<div class="stage"><canvas id="c" aria-label="Bramble the bunny in the Moonroot Wilds"></canvas></div>
<script>
(function(){
  var LW=360, LH=480, GROUND=400, GOAL=60;
  var canvas=document.getElementById('c'), ctx=canvas.getContext('2d'), dpr=1;
  var DEW='#bfe6ee', GOLD='#DFC880', CREAM='#F7F3E8', MOSS='#74896B', WOOD='#5F8B61';
  function resize(){
    var r=canvas.getBoundingClientRect(); dpr=window.devicePixelRatio||1;
    canvas.width=Math.round(r.width*dpr); canvas.height=Math.round(r.height*dpr);
  }
  window.addEventListener('resize',resize); resize();
  function hex(h){return [parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)];}
  function mix(a,b,t){var x=hex(a),y=hex(b);return 'rgb('+Math.round(x[0]+(y[0]-x[0])*t)+','+Math.round(x[1]+(y[1]-x[1])*t)+','+Math.round(x[2]+(y[2]-x[2])*t)+')';}

  var G=1800, G_HOLD=700, V0=-380, MAX_HOLD=.3;
  var runT=0,p,blocks,puddles,items,pops,drops,leafN=0,coinN=0,goodT=0,yeahT=0,count,level=1,state='ready',held=false,holdT=0,spawnT,scroll=0,last=0,spd=130,msg='',msgT=0,half=false;

  function say(s){msg=s; msgT=3;}
  function mkLeaf(x,y){return {x:x,y:y,v:1,col:Math.floor(Math.random()*6),shape:Math.random()<.5?0:1,ph:Math.random()*6};}
  function reset(){
    p={x:70,y:GROUND-34,w:34,h:34,vy:0,ground:true,squash:0};
    blocks=[]; puddles=[]; items=[]; pops=[]; drops=[]; count=0; spawnT=.8; holdT=0; held=false; half=false;
    spd=Math.min(125+level*10,200);
    items.push(mkLeaf(LW+60,GROUND-18),mkLeaf(LW+100,GROUND-18));
  }
  reset();

  // ---- Generated audio: playful chiptune loop and sound effects. No audio files. ----
  var AC=null,master,musicBus,sfxBus,soundOn=true,musicRun=false,nextNote=0,step=0;
  var LEAF=[72,74,76,77,79,81,83,84,86,88], GSEQ=[67,71,74,76,79];
  var CHORDS=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]], ROOTS=[48,45,41,43];
  var ARP=[0,1,2,1,2,1,0,1], ARP2=[0,2,1,2,0,2,1,2];
  function hz(m){return 440*Math.pow(2,(m-69)/12);}
  function tone(f,t,d,type,vol,att,bus){
    var o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(vol,t+(att||.01)); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(bus||sfxBus); o.start(t); o.stop(t+d+.05);
  }
  function bell(m,t,vol,bus){var f=hz(m); tone(f,t,1.6,'sine',vol,.01,bus); tone(f*2.76,t,.45,'sine',vol*.2,.005,bus);}
  function playStep(s,t){
    var bar=Math.floor(s/8)%4, k=s%8, ch=CHORDS[bar], a=(bar%2)?ARP2:ARP;
    tone(hz(ch[a[k]]+12),t,.2,'square',.035,.005,musicBus);
    if(k===0||k===4)tone(hz(ROOTS[bar]),t,.4,'triangle',.12,.005,musicBus);
    else if(k===6)tone(hz(ROOTS[bar]+7),t,.2,'triangle',.07,.005,musicBus);
  }
  function sched(){
    if(!AC||!musicRun)return;
    while(nextNote<AC.currentTime+.4){playStep(step%32,nextNote); nextNote+=.22; step++;}
  }
  function audioStart(){
    try{
      if(!AC){
        AC=new (window.AudioContext||window.webkitAudioContext)();
        master=AC.createGain(); master.gain.value=soundOn?1:0; master.connect(AC.destination);
        musicBus=AC.createGain(); musicBus.connect(master);
        sfxBus=AC.createGain(); sfxBus.connect(master);
        setInterval(sched,100);
      }
      if(AC.state==='suspended')AC.resume();
    }catch(e){}
  }
  function startMusic(){
    if(!AC||musicRun)return;
    musicRun=true; step=0; nextNote=AC.currentTime+.1;
    musicBus.gain.cancelScheduledValues(AC.currentTime); musicBus.gain.setTargetAtTime(1,AC.currentTime,.3);
  }
  function stopMusic(){
    if(!AC||!musicRun)return;
    musicRun=false; musicBus.gain.setTargetAtTime(0,AC.currentTime,.25);
  }
  var NB=null;
  function nbuf(){if(!NB){var n=AC.sampleRate*2; NB=AC.createBuffer(1,n,AC.sampleRate); var d=NB.getChannelData(0); for(var i=0;i<n;i++)d[i]=Math.random()*2-1;} return NB;}
  function cheer(){
    if(!AC)return;
    var t=AC.currentTime+.12;
    if(!NB){var n=AC.sampleRate*2; NB=AC.createBuffer(1,n,AC.sampleRate); var d=NB.getChannelData(0); for(var i=0;i<n;i++)d[i]=Math.random()*2-1;}
    var s=AC.createBufferSource(); s.buffer=NB;
    var nf=AC.createBiquadFilter(); nf.type='bandpass'; nf.frequency.value=1800; nf.Q.value=.6;
    var ng=AC.createGain(); ng.gain.setValueAtTime(.0001,t); ng.gain.linearRampToValueAtTime(.1,t+.2); ng.gain.exponentialRampToValueAtTime(.0001,t+1.5);
    s.connect(nf); nf.connect(ng); ng.connect(sfxBus); s.start(t); s.stop(t+1.6);
    var vb=AC.createGain(), eg=AC.createGain();
    eg.gain.setValueAtTime(.0001,t); eg.gain.linearRampToValueAtTime(.5,t+.12); eg.gain.exponentialRampToValueAtTime(.0001,t+1.4);
    var f1=AC.createBiquadFilter(), f2=AC.createBiquadFilter();
    f1.type='bandpass'; f2.type='bandpass'; f1.Q.value=5; f2.Q.value=5;
    f1.frequency.setValueAtTime(350,t); f1.frequency.linearRampToValueAtTime(750,t+.4);
    f2.frequency.setValueAtTime(2200,t); f2.frequency.linearRampToValueAtTime(1200,t+.4);
    vb.connect(f1); vb.connect(f2); f1.connect(eg); f2.connect(eg); eg.connect(sfxBus);
    for(var k=0;k<8;k++){
      var o=AC.createOscillator(), og=AC.createGain(), b=170+Math.random()*140, st=t+k*.015;
      o.type='sawtooth'; o.frequency.setValueAtTime(b,st); o.frequency.exponentialRampToValueAtTime(b*1.45,st+.4); o.frequency.exponentialRampToValueAtTime(b*1.25,st+1.2);
      og.gain.value=.04; o.connect(og); og.connect(vb); o.start(st); o.stop(t+1.5);
    }
  }
  function sfx(k,v){
    if(!AC)return;
    var t=AC.currentTime;
    if(k==='jump'){
      var o=AC.createOscillator(), g=AC.createGain();
      o.type='square'; o.frequency.setValueAtTime(330,t); o.frequency.exponentialRampToValueAtTime(660,t+.12);
      g.gain.setValueAtTime(.05,t); g.gain.exponentialRampToValueAtTime(.001,t+.16);
      o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t+.2);
    }else if(k==='leaf'){if(v===10){[91,96].forEach(function(b,j){tone(hz(b),t+j*.13,.07,'square',.055,.005); tone(hz(b+5),t+j*.13+.065,.16,'square',.055,.005);});}else{var m=LEAF[v]; tone(hz(m),t,.07,'square',.05,.005); tone(hz(m+5),t+.065,.16,'square',.05,.005);}}
    else if(k==='boing'){
      var kd=v||'common';
      if(kd==='magic'){
        var ns=AC.createBufferSource(); ns.buffer=nbuf(); var hf=AC.createBiquadFilter(); hf.type='highpass'; hf.frequency.value=2500;
        var pg=AC.createGain(); pg.gain.setValueAtTime(.1,t); pg.gain.exponentialRampToValueAtTime(.001,t+.12);
        ns.connect(hf); hf.connect(pg); pg.connect(sfxBus); ns.start(t); ns.stop(t+.15);
        for(var s2=0;s2<4;s2++)tone(2200+Math.random()*1800,t+.06+s2*.045,.07,'sine',.03,.005);
        [79,84,88,91,96].forEach(function(m,i){bell(m,t+.2+i*.07,.05);});
      }else{
        var gi=kd==='giant';
        tone(gi?90:130,t,gi?.18:.12,'sine',.14,.005);
        var o2=AC.createOscillator(), g2=AC.createGain();
        o2.type='sine'; o2.frequency.setValueAtTime(gi?250:320,t+.06); o2.frequency.exponentialRampToValueAtTime(gi?900:700,t+.06+(gi?.3:.2));
        g2.gain.setValueAtTime(.0001,t+.06); g2.gain.linearRampToValueAtTime(.1,t+.09); g2.gain.exponentialRampToValueAtTime(.001,t+.06+(gi?.34:.24));
        o2.connect(g2); g2.connect(sfxBus); o2.start(t+.06); o2.stop(t+.5);
      }
    }
    else if(k==='cheer'){cheer();}
    else if(k==='good'){[784,988,1175,1568].forEach(function(f,i){tone(f,t+.25+i*.07,.2,'square',.05,.005);});}
    else if(k==='coin'){
      var gm=GSEQ[v%GSEQ.length]+12;
      var gs=AC.createOscillator(), gg=AC.createGain();
      gs.type='sine'; gs.frequency.setValueAtTime(hz(gm)*.7,t); gs.frequency.exponentialRampToValueAtTime(hz(gm),t+.14);
      gg.gain.setValueAtTime(.0001,t); gg.gain.linearRampToValueAtTime(.05,t+.03); gg.gain.exponentialRampToValueAtTime(.001,t+.17);
      gs.connect(gg); gg.connect(sfxBus); gs.start(t); gs.stop(t+.2);
      bell(gm,t+.1,.07); bell(gm+12,t+.1,.025);
      for(var h2=0;h2<5;h2++)tone(3000+Math.random()*2200,t+.1+h2*.035,.06,'sine',.018,.005);
      bell(gm,t+.34,.03); bell(gm,t+.56,.014);
    }
    else if(k==='splash'){tone(700,t,.12,'sine',.03);}
    else if(k==='win'){[523,659,784,1047].forEach(function(f,i){tone(f,t+.1+i*.12,.25,'square',.06,.005);});}
  }
  var muteBtn=document.getElementById('mute');
  muteBtn.addEventListener('click',function(){
    soundOn=!soundOn; muteBtn.textContent=soundOn?'♪ On':'♪ Off';
    if(master)master.gain.setTargetAtTime(soundOn?1:0,AC.currentTime,.05);
  });
  document.addEventListener('visibilitychange',function(){
    if(!AC)return; if(document.hidden)AC.suspend(); else AC.resume();
  });

  function press(){
    audioStart();
    if(state==='won'){level++; reset(); state='play'; startMusic(); say('Bramble feels braver…'); return;}
    if(state==='ready'){state='play'; startMusic(); say('Bramble peeks out…');}
    held=true;
    if(p.ground){p.vy=V0; p.ground=false; holdT=0; p.squash=-.25; sfx('jump');}
  }
  function release(){held=false;}
  canvas.addEventListener('pointerdown',function(e){e.preventDefault(); press();});
  window.addEventListener('pointerup',release);
  window.addEventListener('pointercancel',release);
  window.addEventListener('keydown',function(e){if(e.code==='Space'&&!e.repeat){e.preventDefault(); press();}});
  window.addEventListener('keyup',function(e){if(e.code==='Space')release();});

  function spawn(){
    var r=Math.random(), x0=LW+30;
    if(r<.2){
      var pw=50+Math.floor(Math.random()*30);
      puddles.push({x:x0,w:pw,hit:false});
      items.push(mkLeaf(x0+pw/2,GROUND-60));
    }else{
      var type=r<.5?'log':r<.8?'mush':'root', w, h, inset=0, kind='';
      if(type==='log'){w=56+Math.floor(Math.random()*18); h=24+Math.floor(Math.random()*14);}
      else if(type==='mush'){
        var rk=Math.random(); kind=rk<.6?'common':rk<.88?'giant':'magic';
        if(kind==='common'){w=46+Math.floor(Math.random()*14); h=34+Math.floor(Math.random()*26);}
        else if(kind==='giant'){w=70+Math.floor(Math.random()*16); h=50+Math.floor(Math.random()*24);}
        else{w=54+Math.floor(Math.random()*10); h=40+Math.floor(Math.random()*20);}
      }
      else{w=56+Math.floor(Math.random()*16); h=22+Math.floor(Math.random()*16); inset=w*.3;}
      blocks.push({t:type,x:x0,w:w,h:h,i:inset,kind:kind,k:kind==='giant'?2.1:kind==='magic'?2.6:1.5});
      items.push(mkLeaf(x0+w/2,GROUND-h-18));
      if(type==='mush'){
        var kk=kind==='giant'?2.1:kind==='magic'?2.6:1.5;
        var taus=kind==='common'?[.2,.36]:kind==='giant'?[.2,.38,.56,.74]:[.2,.4,.6,.8,1.0];
        taus.forEach(function(tt,j){
          var ay=GROUND-h-(380*kk*tt-900*tt*tt), ax=x0+135*tt-10;
          var coin=(kind==='magic'&&j===2)||(kind==='giant'&&j===2&&Math.random()<.45);
          items.push(coin?{x:ax,y:ay,v:3,seed:true}:mkLeaf(ax,ay));
        });
      }
    }
    items.push(mkLeaf(x0+105+Math.random()*20,GROUND-45));
    if(Math.random()<.07)items.push({x:x0+160+Math.random()*30,y:GROUND-100,v:3,seed:true});
    spawnT=Math.max(1.3,1.8-level*.05)+Math.random()*.9;
  }
  function splash(x){
    for(var i=0;i<6;i++)drops.push({x:x,y:GROUND,vx:(Math.random()-.5)*80,vy:-120-Math.random()*80,t:0});
  }

  function update(dt){
    scroll+=dt*(state==='play'?spd:state==='ready'?40:0); runT+=dt;
    if(msgT>0)msgT-=dt; if(goodT>0)goodT-=dt; if(yeahT>0)yeahT-=dt;
    if(p.squash!==0){p.squash*=.85; if(Math.abs(p.squash)<.01)p.squash=0;}
    var i;
    for(i=pops.length-1;i>=0;i--){pops[i].t+=dt; if(pops[i].t>.6)pops.splice(i,1);}
    for(i=drops.length-1;i>=0;i--){var d=drops[i]; d.t+=dt; d.x+=d.vx*dt; d.vy+=500*dt; d.y+=d.vy*dt; if(d.t>.5)drops.splice(i,1);}
    if(state!=='play')return;

    spawnT-=dt; if(spawnT<=0)spawn();
    blocks.forEach(function(b){b.x-=spd*dt; if(b.sq)b.sq*=.88;});
    puddles.forEach(function(q){q.x-=spd*dt;});
    items.forEach(function(c){c.x-=spd*dt;});
    blocks=blocks.filter(function(b){return b.x+b.w>-20;});
    puddles=puddles.filter(function(q){return q.x+q.w>-20;});
    items=items.filter(function(c){return c.x>-20;});

    var g=G;
    if(!p.ground&&held&&p.vy<0&&holdT<MAX_HOLD){g=G_HOLD; holdT+=dt;}
    var prevB=p.y+p.h;
    p.vy+=g*dt; p.y+=p.vy*dt;
    var floor=GROUND, bot=p.y+p.h, fb=null;
    if(p.vy>=0){
      blocks.forEach(function(b){
        var top=GROUND-b.h, L=b.x+b.i, R=b.x+b.w-b.i;
        if(p.x+p.w-6>L&&p.x+6<R&&prevB<=top+2&&top<floor){floor=top; fb=b;}
      });
    }
    p.ground=false;
    if(p.vy>=0&&bot>=floor){
      if(p.vy>250)p.squash=.3;
      p.y=floor-p.h; p.vy=0; p.ground=true;
      if(fb&&fb.t==='mush'){p.vy=V0*fb.k; p.ground=false; holdT=MAX_HOLD; p.squash=-.35; fb.sq=1; sfx('boing',fb.kind);}
      else if(held){p.vy=V0; p.ground=false; holdT=0; p.squash=-.25; sfx('jump');}
    }
    if(p.ground&&p.y+p.h>=GROUND-1){
      puddles.forEach(function(q){
        var cx=p.x+p.w/2;
        if(!q.hit&&cx>q.x&&cx<q.x+q.w){q.hit=true; splash(cx); sfx('splash');}
      });
    }

    items=items.filter(function(c){
      var hit=p.x+p.w-4>c.x-9&&p.x+4<c.x+9&&p.y+p.h>c.y-12&&p.y<c.y+12;
      if(hit){if(c.seed){sfx('coin',coinN); coinN++; if(coinN%5===0){sfx('good'); goodT=1.6;}}else{sfx('leaf',leafN%11); if(leafN%11===10){sfx('cheer'); yeahT=1.4;} leafN++;} count+=c.v; pops.push({x:c.x,y:c.y,t:0,s:'+'+c.v});}
      return !hit;
    });
    if(!half&&count>=GOAL/2){half=true; say('A hidden path opens…');}
    if(count>=GOAL){count=GOAL; state='won'; stopMusic(); sfx('win');}
  }

  function text(s,x,y,size,color,align){
    ctx.fillStyle=color; ctx.font=size+'px Georgia,serif'; ctx.textAlign=align||'center';
    ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=4; ctx.fillText(s,x,y); ctx.shadowBlur=0;
  }
  var AUT=['#c8402a','#e8862a','#f0c23b','#b5651d','#9c2f3a','#9bb83a'];
  function hsh(n){var v=Math.sin(n*127.1)*43758.5453; return v-Math.floor(v);}
  function bt(x,base,h,col,cols,seed){
    var tw=h*.05;
    ctx.fillStyle='#5a4130'; ctx.fillRect(x-tw,base-h*.55,tw*2,h*.55);
    var cy=base-h*.72;
    for(var i=0;i<9;i++){
      var a=hsh(seed+i)*6.28, d=hsh(seed*3+i)*h*.2;
      ctx.fillStyle=cols?cols[i%cols.length]:col;
      ctx.beginPath(); ctx.arc(x+Math.cos(a)*d*1.3,cy+Math.sin(a)*d*.7,h*(.13+hsh(seed+i*5)*.07),0,7); ctx.fill();
    }
    if(cols){ctx.fillStyle='rgba(255,240,170,.2)'; ctx.beginPath(); ctx.arc(x+h*.08,cy-h*.1,h*.13,0,7); ctx.fill();}
  }
  function forest(spacing,factor,base,h,col,mode){
    var off=-((scroll*factor)%spacing);
    for(var x=off-spacing;x<LW+spacing;x+=spacing){
      var idx=Math.round((x+scroll*factor)/spacing), hh=h*(.85+.3*hsh(idx));
      if(mode){var m=AUT[((idx%6)+6)%6]; bt(x,base,hh,null,[m,m,AUT[(((idx+2)%6)+6)%6]],idx*7.3);}
      else bt(x,base,hh,col,null,idx*7.3);
    }
  }
  function giant(x,w,idx){
    var g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);
    g.addColorStop(0,'#4a3424'); g.addColorStop(.55,'#7a5638'); g.addColorStop(1,'#a07548');
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(x-w/2,0); ctx.lineTo(x+w/2,0); ctx.lineTo(x+w/2,GROUND-30);
    ctx.quadraticCurveTo(x+w/2+4,GROUND-8,x+w*.9,GROUND); ctx.lineTo(x-w*.9,GROUND);
    ctx.quadraticCurveTo(x-w/2-4,GROUND-8,x-w/2,GROUND-30); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.lineWidth=2;
    for(var k=-2;k<=2;k++){ctx.beginPath(); ctx.moveTo(x+k*w*.17,0); ctx.bezierCurveTo(x+k*w*.17+6,GROUND*.3,x+k*w*.17-6,GROUND*.6,x+k*w*.19,GROUND); ctx.stroke();}
    ctx.fillStyle='rgba(95,139,97,.55)'; ctx.beginPath(); ctx.ellipse(x-w*.25,GROUND-4,w*.35,40,0,Math.PI,2*Math.PI); ctx.fill();
    for(var f=0;f<7;f++){
      ctx.fillStyle=AUT[(((idx+f)%6)+6)%6]; ctx.globalAlpha=.95;
      ctx.beginPath(); ctx.arc(x+(hsh(idx*3+f)-.5)*190,hsh(idx*5+f)*60,38+hsh(idx+f*9)*24,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  function fern(x,s,col){
