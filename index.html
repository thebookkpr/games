<!DOCTYPE html>
<!-- The Book Keeper's Library (site menu) — index.html V1.0 · Part 1 of 1
     Lives at games/index.html.
     Uses css/variables.css, css/base.css and css/effects.css from this same folder.
     To add a world: add one entry to the WORLDS list near the bottom. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#120a07">
  <title>The Book Keeper's Library</title>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/effects.css">
  <style>
    .library-title {
      margin: 0;
      font-weight: normal;
      font-size: clamp(1.7rem, 6vw, 3.6rem);
      letter-spacing: 0.2em;
      text-indent: 0.2em;
      text-transform: uppercase;
      color: var(--gold-bright);
      text-shadow: 0 0 20px var(--gold-glow), 0 3px 10px rgba(0, 0, 0, 0.7);
    }
    .library-motto {
      margin: 1em 0 0;
      font-style: italic;
      font-size: clamp(1rem, 2.4vw, 1.3rem);
      color: var(--parchment);
      opacity: 0.9;
    }
    .library-tag {
      margin: 0;
      font-family: var(--font-ui);
      font-size: clamp(0.7rem, 1.8vw, 0.9rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--brass);
    }

    /* The shelf: each world is a leather-bound book */
    .shelf {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 350px));
      justify-content: center;
      gap: 28px;
      margin: 2em 0 0;
      padding: 0;
      list-style: none;
      text-align: left;
    }
    .book {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 22px 22px 20px 32px;
      color: var(--parchment);
      text-decoration: none;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.5) 0, rgba(0, 0, 0, 0) 16px),
        linear-gradient(145deg, var(--cover-light, var(--leather-light)), var(--cover, var(--leather)));
      border: 1px solid var(--gold-line);
      border-radius: 3px 10px 10px 3px;
      box-shadow: var(--shadow-soft);
      transition: transform var(--fade-fast) var(--ease-gentle),
                  box-shadow var(--fade-fast) var(--ease-gentle);
    }
    /* Gold tooling just inside the cover edge */
    .book::before {
      content: "";
      position: absolute;
      inset: 8px 8px 8px 20px;
      border: 1px solid var(--gold-line);
      border-radius: 2px;
      pointer-events: none;
    }
    a.book:hover, a.book:focus-visible {
      transform: translateY(-5px);
      box-shadow: var(--shadow-soft), 0 0 24px var(--gold-glow);
      outline: none;
    }
    .book-art {
      aspect-ratio: 20 / 9;
      margin-bottom: 14px;
      background: var(--wood-deep) center / cover no-repeat;
      border: 1px solid var(--gold);
      box-shadow: inset 0 0 14px rgba(0, 0, 0, 0.5);
    }
    .book-kind {
      margin: 0;
      font-family: var(--font-ui);
      font-size: 0.7rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .book-title {
      margin: 6px 0 8px;
      font-weight: normal;
      font-size: 1.5rem;
      letter-spacing: 0.08em;
      color: var(--gold-bright);
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
    }
    .book-desc { margin: 0; flex: 1; font-size: 0.98rem; line-height: 1.55; opacity: 0.92; }
    .book-go {
      align-self: flex-start;
      margin-top: 14px;
      padding: 0.5em 1.4em;
      font-family: var(--font-ui);
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold-bright);
      border: 1px solid var(--gold);
      border-radius: var(--radius);
      background: rgba(0, 0, 0, 0.25);
    }

    /* Placeholder: an empty space on the shelf, not clickable */
    .book.soon {
      justify-content: center;
      align-items: center;
      min-height: 260px;
      text-align: center;
      font-style: italic;
      background: rgba(0, 0, 0, 0.18);
      border-style: dashed;
      box-shadow: none;
      opacity: 0.65;
    }
    .book.soon::before { display: none; }

    .keeper {
      margin: 3em 0 0;
      font-style: italic;
      color: var(--brass);
    }
    .version {
      margin: 0.8em 0 0;
      font-family: var(--font-ui);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--brass);
      opacity: 0.6;
    }
    @media (prefers-reduced-motion: reduce) { .book { transition: none; } }
  </style>
</head>
<body>

  <div class="backdrop"></div>
  <div class="fx-layer" id="fx"></div>

  <main class="page">
    <h1 class="library-title">The Book Keeper's Library</h1>
    <p class="library-motto">Storybook worlds, kept with care.</p>
    <div class="rule"></div>
    <p class="library-tag">Choose a volume</p>
    <ul class="shelf" id="shelf"></ul>
    <p class="keeper">Kept by The Book Keeper</p>
    <p class="version">V1.0</p>
  </main>

  <script>
    /* ---------- Add new worlds here ---------- */
    const WORLDS = [
      {
        title: "Burrow Whispers",
        kind: "Volume I · Gentle Fantasy",
        desc: "A quiet world of little lives and moonlit woods, where small pets find wonder close to home.",
        url: "burrow-whispers/",
        art: "burrow-whispers/lunelle/one-more-little-step/images/title-screen.jpg",
        cover: "#1f3b2d",
        coverLight: "#2f5a45"
      }
    ];
    const SHOW_COMING_SOON = true;   /* set false to hide the empty space on the shelf */

    /* ---------- Build the shelf ---------- */
    const shelf = document.getElementById("shelf");
    const el = (tag, cls, text) => {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text) n.textContent = text;
      return n;
    };

    WORLDS.forEach(w => {
      const li = el("li");
      const a = el("a", "book");
      a.href = w.url;
      if (w.cover) a.style.setProperty("--cover", w.cover);
      if (w.coverLight) a.style.setProperty("--cover-light", w.coverLight);
      const art = el("div", "book-art");
      art.style.backgroundImage = `url("${w.art}")`;
      a.append(art, el("p", "book-kind", w.kind), el("h2", "book-title", w.title),
               el("p", "book-desc", w.desc), el("span", "book-go", "Open"));
      li.appendChild(a);
      shelf.appendChild(li);
    });

    if (SHOW_COMING_SOON) {
      const li = el("li");
      li.appendChild(el("div", "book soon", "More volumes are being written."));
      shelf.appendChild(li);
    }

    /* ---------- Candlelit effects (styles come from effects.css) ---------- */
    const rand = (a, b) => a + Math.random() * (b - a);
    const fx = document.getElementById("fx");
    function add(cls, style, vars) {
      const d = el("div", cls);
      if (style) d.style.cssText = style;
      if (vars) Object.entries(vars).forEach(([k, v]) => d.style.setProperty(k, v));
      fx.appendChild(d);
    }
    add("haze one"); add("haze two");
    [[4, 2, 34, 40, 0], [66, 0, 34, 40, 2.2]].forEach(([x, y, w, h, d]) =>
      add("candle", `left:${x}%;top:${y}%;width:${w}%;height:${h}%`, { "animation-delay": -d + "s" }));
    for (let i = 0; i < 16; i++)
      add("mote", `left:${rand(5, 95).toFixed(1)}%;top:${rand(10, 90).toFixed(1)}%`, {
        "--dur": rand(5, 9).toFixed(1) + "s",
        "--delay": (-rand(0, 9)).toFixed(1) + "s",
        "--drift": rand(-30, 30).toFixed(0) + "px"
      });
  </script>

</body>
</html>
