<!DOCTYPE html>
<html lang="en">
<head>

<body>

<!-- Dappled light, pollen, and ferns: purely decorative -->
<div class="pollen" aria-hidden="true">

</div>

<main>

  <!-- Menu 1: Games -->
  <section class="screen card" id="games" aria-labelledby="games-title">
    <h1 id="games-title" tabindex="-1">Games</h1>
    <p class="lead">A quiet path winds through the garden. See what Bramble found.</p>
    <ul class="menu">
      <li>
        <a class="btn" href="#collect-carrots">Collect Carrots</a>
        <p class="hint">Something orange is peeking out of the soil.</p>
      </li>
    </ul>
  </section>

  <!-- Menu 2: Collect Carrots -->
  <section class="screen card" id="collect-carrots" aria-labelledby="carrot-title" hidden>
    <h1 id="carrot-title" tabindex="-1">Carrot Collector</h1>
    <p class="lead">Follow the bunny into the forest and gather what the garden has hidden.</p>
    <ul class="menu">
      <li>
        <a class="btn" data-external href="https://thebookkpr.github.io/games/carrot-collector/bunny-in-forest.html">Take the First Step</a>
      </li>
    </ul>
    <a class="back" href="#games">Back to Games</a>
  </section>

</main>
