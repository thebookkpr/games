<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1830">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
    <link rel="preload" as="image" href="images/title-screen.jpg">
  <title>One More Little Step</title>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/title.css">
  <link rel="stylesheet" href="css/scene.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/effects.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>


<script>
(function(){
  var d=document.createElement('div');
  d.style.cssText='position:fixed;left:0;top:0;z-index:9999;background:rgba(0,0,0,.7);color:#fff;font:12px monospace;padding:4px;pointer-events:none';
  document.body.appendChild(d);
  ['pointerdown','click'].forEach(function(t){
    document.addEventListener(t,function(e){
      var el=document.elementFromPoint(e.clientX,e.clientY);
      var s=t+': '+(el?el.tagName+'.'+el.className:'none');
      d.innerHTML = t==='pointerdown' ? s : d.innerHTML+'<br>'+s;
    },true);
  });
})();
</script>



  
<body>

  <div id="game">

    <section id="title-screen" class="screen active">
      <div class="bg"></div>
      <div class="title-block">
        <h1 class="game-title">ONE MORE LITTLE STEP</h1>
        <p class="game-subtitle">A Burrow Whispers Story</p>
      </div>
      <nav class="menu">
        <button class="menu-btn primary" id="btn-start">Start Journey</button>
        <button class="menu-btn" id="btn-continue" disabled>Continue</button>
        <button class="menu-btn" id="btn-settings">Settings</button>
        <button class="menu-btn" id="btn-credits">Credits</button>
      </nav>
    </section>

  </div>

  <script src="js/scenes.js"></script>
  <script src="js/game.js"></script>
  
</body>
</html>
